name: Build and test

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and behavioral tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code and pinned GlitchLib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the repository's Java version
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Validate wrapper and cache Gradle dependencies
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Record build environment
        run: |
          java -version
          ./gradlew --version
          git submodule status

      - name: Build and run tests
        id: build
        run: ./gradlew build --no-daemon --console=plain

      - name: Explain results
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 tools/ci_summary.py

      - name: Keep detailed test and build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14
